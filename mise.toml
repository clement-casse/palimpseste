[tools]
rust = { version = "1.99.0", mr_boxington = true, targets = "wasm32-unknown-unknown" }
mr-boxington = "latest"
"cargo:cargo-sort" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-tarpaulin" = "latest"
# Must match the wasm-bindgen version locked in Cargo.lock.
"cargo:wasm-bindgen-cli" = "0.2.129"
node = "24"
pnpm = "10.33.0"
flyctl = "latest"

[env]
RUST_LOG = "info,tower_http=warn"

[tasks.fmt]
run = "cargo fmt --all -- --config group_imports=StdExternalCrate,imports_granularity=Crate,format_code_in_doc_comments=true"

[tasks.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
run = "cargo nextest run --workspace --no-tests=pass"

[tasks.doc-test]
run = "cargo test --doc --workspace"

[tasks.coverage]
run = "cargo tarpaulin --workspace --engine llvm --out Stdout --out Xml --output-dir target/coverage"

[tasks.check]
depends = ["fmt", "lint", "test", "doc-test"]

[tasks."wasm:build"]
description = "Compile the engines to WebAssembly and generate their JavaScript bindings into the front end"
run = [
  "cargo build -p palimpseste-wasm --target wasm32-unknown-unknown --release",
  "wasm-bindgen --target web --out-dir app/frontend/src/wasm target/wasm32-unknown-unknown/release/palimpseste_wasm.wasm",
]

[tasks."frontend:install"]
description = "Install the front end dependencies"
dir = "app/frontend"
run = "pnpm install"

[tasks."frontend:check"]
description = "Type-check the front end"
depends = ["wasm:build", "frontend:install"]
dir = "app/frontend"
run = "pnpm run check"

[tasks."frontend:test"]
description = "Run the front end tests (Vitest, jsdom)"
depends = ["wasm:build", "frontend:install"]
dir = "app/frontend"
run = "pnpm run test"

[tasks."frontend:build"]
description = "Build the PWA into app/frontend/dist"
depends = ["wasm:build", "frontend:install"]
dir = "app/frontend"
run = "pnpm run build"

[tasks."frontend:dev"]
description = "Vite dev server, proxying /api to the backend (run `mise run serve` alongside)"
depends = ["wasm:build", "frontend:install"]
dir = "app/frontend"
run = "pnpm run dev"

[tasks.serve]
description = "Build the PWA and serve it with the API on http://127.0.0.1:3000"
depends = ["frontend:build"]
run = "cargo run -p palimpseste-backend"

[tasks."frontend:e2e"]
description = "End-to-end tests in Chromium: the built PWA on the backend, signing in through a mock OIDC provider"
depends = ["frontend:build"]
dir = "app/frontend"
run = "pnpm exec playwright install chromium && pnpm exec playwright test"
