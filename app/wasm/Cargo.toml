[package]
name = "palimpseste-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
co-contemporain = { path = "../../crates/co-contemporain" }
co-fantasy = { path = "../../crates/co-fantasy" }
co-kernel = { path = "../../crates/co-kernel" }
palimpseste-document = { path = "../document", features = ["ts"] }
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.129"

[lints]
workspace = true
