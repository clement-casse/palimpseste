# Deploys to Fly.io every push to main whose CI run succeeded. A workflow of its
# own, started by CI's completion, so pull requests never show a deploy job.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deployment at a time, never cancelled midway; a newer commit waiting
# here replaces an older one still waiting.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"

jobs:
  deploy:
    name: Deploy to Fly.io
    # Only green runs started by a push: not a manual CI run on main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The commit CI checked, not the tip of main when this run starts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@v5
        with:
          install_args: --locked flyctl
      # Fly's remote builder builds the Dockerfile, so the image build costs
      # no Actions minutes.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
