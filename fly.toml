# The Palimpseste server on Fly.io: one machine, its SQLite database on one
# volume. The image sets PALIMPSESTE_ADDR, _FRONTEND_DIR and _DATABASE.
# Client secrets are Fly secrets (`fly secrets set`), never set here.

app = 'palimpseste'
primary_region = 'cdg'

[env]
  PALIMPSESTE_PUBLIC_URL = 'https://palimpseste.fly.dev'
  RUST_LOG = 'info'
  PALIMPSESTE_OIDC_PROVIDERS = "discord"
  PALIMPSESTE_OIDC_DISCORD_NAME = "Discord"
  PALIMPSESTE_OIDC_DISCORD_ISSUER = "https://discord.com"
  PALIMPSESTE_OIDC_DISCORD_SCOPES="openid identify email"

# SQLite needs a single machine: keep `fly scale count 1`.
[mounts]
  source = 'palimpseste_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Plain http to the machine: the app never redirects, force_https is the
  # proxy's. 200 only while the database answers (ADR BE-HEALTH).
  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    timeout = '2s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
