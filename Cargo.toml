[workspace]
resolver = "3"
members = [
    "app/backend",
    "app/document",
    "app/wasm",
    "crates/co-contemporain",
    "crates/co-fantasy",
    "crates/co-kernel",
]
# A bare `cargo run` at the root starts the server.
default-members = ["app/backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
